# ── FlyTest ──────────────────────────────────────────────────────────────
#
# Почему MinGW, а не MSVC.
#
# TFLY.h использует `sincosf` — это расширение glibc, в Windows CRT его
# нет. Под MSVC линкер падает:
#     error LNK2019: unresolved external symbol sincosf
#     error LNK1120: 2 unresolved externals
#
# Это не ошибка сборки, а граница переносимости кода: ядро написано под
# GNU-окружение (libc + libm), о чём и сказано в README. Переписывать
# 106 КБ заголовка ради CI — работа без пользы для читателя, поэтому CI
# собирает тем же тулчейном, для которого код написан и который используется
# локально. Ограничение зафиксировано в README репозитория.
#
# Rust-часть проекта от C-ядра не зависит: если компилятора нет, build.rs
# компилирует биндинги out, и крейт собирается как чистый Rust.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ядро TFLY + Rust-runtime (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # MinGW есть в образе windows-latest по пути C:\mingw64.
      # Шаг НЕ должен падать, если компилятора нет: об этом честнее
      # сообщит сам cargo build, давая внятную ошибку линковки. Раньше
      # здесь стоял `(g++ --version)[0]`, и отсутствие компилятора
      # роняло весь job с невнятным CommandNotFoundException.
      - name: Подготовить MinGW
        shell: pwsh
        run: |
          $candidates = @("C:\mingw64\bin", "C:\msys64\mingw64\bin",
                          "C:\ProgramData\mingw64\mingw64\bin")
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c "g++.exe")) { $found = $c; break }
          }
          if ($found) {
            "MinGW найден: $found"
            $env:PATH = "$found;$env:PATH"
            # В GITHUB_PATH пишутся голые пути, а в GITHUB_ENV — только
            # пары KEY=VALUE. Путь в GITHUB_ENV ломает разбор всего job:
            # «Invalid format 'C:\mingw64\bin'». Поэтому только GITHUB_PATH.
            # Кодировка ascii, потому что utf8 добавляет BOM, и runner
            # не может разобрать первую строку файла.
            Add-Content -Path $env:GITHUB_PATH -Value $found -Encoding ascii
            & (Join-Path $found "g++.exe") --version | Select-Object -First 1
          } else {
            "MinGW не найден. Сборка C-ядра невозможна, Rust-часть "
            "соберётся без него (build.rs это умеет)."
            "warning: MinGW отсутствует, ядро TFLY не будет собрано"
          }

      # Готовые actions не берут хост в названии канала:
      # «target tuple in channel name 'stable-x86_64-pc-windows-gnu'».
      # Для rustup этот формат корректен, поэтому ставим напрямую.
      - name: Установить Rust под gnu-хост
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustup run stable-x86_64-pc-windows-gnu rustc --version

      - name: Сборка с C-ядром
        run: |
          cargo build --release 2>&1 | tail -25

      - name: C-ядро действительно подключено
        shell: pwsh
        run: |
          if (-not (Test-Path target\release\flytest.exe)) {
            "бинарник не создан"; exit 1
          }
          "flytest.exe: {0:N0} байт" -f (Get-Item target\release\flytest.exe).Length
          if ((Get-Item target\release\flytest.exe).Length -lt 1000000) {
            "подозрительно мало для бинарника со встроенной моделью"; exit 1
          }

      - name: clippy (отчёт, без падения)
        run: |
          cargo clippy --all-targets --message-format=short 2>&1 \
            | grep -E ': (warning|error)' | head -20 || true
          echo "clippy отработал, сборку не роняем."

  # Полный прогон. Отдельным job, потому что он проверяет то, чего нет в сборке:
  # C-тесты ядра, синтаксис браузерного клиента, русский текст и лимит памяти.
  # Пока эти проверки жили только в голове у того, кто их запускал, они
  # запускались ровно до тех пор, пока про него помнили.
  gate:
    name: Полный прогон (тесты + лимит 100 МБ)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить MinGW
        run: |
          $candidates = @("C:\mingw64\bin", "C:\msys64\mingw64\bin",
                          "C:\ProgramData\mingw64\mingw64\bin")
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c "g++.exe")) { $found = $c; break }
          }
          if ($found) {
            "MinGW найден: $found"
            Add-Content -Path $env:GITHUB_PATH -Value $found -Encoding ascii
          } else {
            "MinGW не найден: C-тесты будут пропущены, остальное идёт."
          }

      - name: Установить Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update
          rustup default stable-x86_64-pc-windows-gnu

      - name: Установить Python и Node
        run: |
          "python: $((python --version) 2>&1)"
          "node:   $(node --version)"

      - name: Полный прогон
        run: |
          # -SkipMemory нет: сто мегабайт это требование, а не пожелание, и
          # проверять его надо на каждом пуше, а не когда вспомнится.
          .\scripts\check_all.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
