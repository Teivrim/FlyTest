# ── FlyTest ─────────────────────────────────────────────────────────────
# C-ядро TFLY компилируется через build.rs. На CI компилятор есть
# (MSVC в образе windows-latest), поэтому собирается полная версия.
# rust-toolchain.toml в проекте не закреплён, так что хватает stable.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ядро TFLY + Rust-runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Сборка с C-ядром
        run: cargo build --release

      # build.rs умеет деградировать, если компилятора нет. Это полезно
      # для кросс-компиляции, но в CI компилятор есть, и мы хотим
      # убедиться, что полная сборка действительно работает.
      - name: C-ядро действительно собрано
        run: |
          $out = cargo build --release --message-format=json 2>&1
          if ($out -match "aborted|error") { $out; exit 1 }
          "Ядро собрано, полная функциональность доступна."

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Тесты C-ядра
        run: |
          if (Test-Path native\tfly_test.c) {
            cl /nologo /W3 /O2 /I. native\tfly_test.c /Fe:build\tfly_test.exe
            if (Test-Path build\tfly_test.exe) {
              "Сборка C-тестов прошла."
            }
          }
