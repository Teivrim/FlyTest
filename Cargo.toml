[package]
name = "flytest"
version = "0.1.0"
edition = "2024"
description = "FlyTest digital circus runtime and FlyWire connectome tools"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
# The TFLY bindings in src/tfly.rs call into a C core, which requires `unsafe`.
# That module opts in locally with #[allow(unsafe_code)]; the rest of the crate
# still treats unsafe as a hard error.
unsafe_code = "deny"
